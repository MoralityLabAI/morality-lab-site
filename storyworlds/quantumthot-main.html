<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=https://storyworld-app.vercel.app">
  <title>QuantumThot Retired | Storyworld App</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: rgba(16, 24, 40, 0.84);
      --line: rgba(127, 163, 255, 0.22);
      --text: #e8eef9;
      --muted: #9eb0cc;
      --accent: #7dd3fc;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background:
        radial-gradient(circle at top, rgba(125, 211, 252, 0.18), transparent 30%),
        linear-gradient(180deg, #070b14 0%, #0b1020 100%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .card {
      width: min(720px, 100%);
      padding: 2rem;
      border-radius: 24px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin: 0 0 0.75rem;
      color: var(--accent);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.74rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1.05;
    }

    p {
      color: var(--muted);
      line-height: 1.7;
      font-size: 1rem;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.8rem 1.1rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      border: 1px solid transparent;
    }

    .primary {
      background: linear-gradient(135deg, #7dd3fc, #38bdf8);
      color: #06101a;
    }

    .secondary {
      color: var(--text);
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.04);
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Storyworld retired</p>
    <h1>QuantumThot has moved.</h1>
    <p>
      The old Storyworld landing page is retired. The live app, reader, and gallery now live at the new deployment.
    </p>
    <div class="actions">
      <a class="primary" href="https://storyworld-app.vercel.app">Open Storyworld App</a>
      <a class="secondary" href="https://storyworld-app.vercel.app/reader">Open Reader</a>
    </div>
  </main>
</body>
</html>
